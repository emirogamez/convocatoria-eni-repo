<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitaciones | SENA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Colores institucionales SENA */
      --sena-green:       #39A900;
      --sena-green-dark:  #2D8500;
      --sena-green-light: #7CCB00;
      --sena-blue:        #00324D;
      --sena-blue-dark:   #001F30;
      --sena-yellow:      #FDC300;
      --sena-gray:        #F4F6F9;
      --ink:              #1a1d29;
      --ink-soft:         #5c6270;
    }

    * { -webkit-font-smoothing: antialiased; }

    body {
      background:
        linear-gradient(180deg, #ffffff 0%, #f4f9f0 40%, #eef7ea 100%);
      background-attachment: fixed;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      position: relative;
      overflow-x: hidden;
    }

    /* Decoración sutil de fondo */
    body::before {
      content: "";
      position: fixed;
      top: -200px; right: -200px;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(57,169,0,0.10), transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      bottom: -200px; left: -200px;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,50,77,0.08), transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    /* Barra superior institucional */
    .top-strip {
      height: 6px;
      background: linear-gradient(90deg,
        var(--sena-green) 0%,
        var(--sena-green-light) 50%,
        var(--sena-yellow) 100%);
      position: sticky;
      top: 0;
      z-index: 200;
    }

    /* Header */
    .app-header {
      background: #ffffff;
      border-bottom: 1px solid #e8ece6;
      box-shadow: 0 4px 20px rgba(0, 50, 77, 0.06);
      position: sticky;
      top: 6px;
      z-index: 100;
    }
    .app-header .logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--sena-green) 0%, var(--sena-green-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      box-shadow: 0 6px 18px rgba(57, 169, 0, 0.35);
      position: relative;
      overflow: hidden;
    }
    .app-header .logo-badge::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 6px;
      background: var(--sena-yellow);
    }

    .app-title {
      color: var(--sena-blue);
      font-weight: 800;
      letter-spacing: -0.4px;
      margin: 0;
    }
    .app-title .accent {
      color: var(--sena-green);
    }
    .app-sub {
      color: var(--ink-soft);
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* Botón recargar institucional */
    .btn-sena {
      background: linear-gradient(135deg, var(--sena-green) 0%, var(--sena-green-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      padding: 0.55rem 1.1rem;
      box-shadow: 0 4px 14px rgba(57, 169, 0, 0.32);
      transition: all 0.25s ease;
      font-size: 0.9rem;
    }
    .btn-sena:hover {
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(57, 169, 0, 0.45);
      background: linear-gradient(135deg, var(--sena-green-dark) 0%, #236b00 100%);
    }
    .btn-sena:disabled { opacity: 0.6; color: #fff; }

    /* Contador */
    .count-pill {
      background: var(--sena-blue);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.4rem 0.95rem;
      border-radius: 999px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 12px rgba(0, 50, 77, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .count-pill::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--sena-green-light);
      box-shadow: 0 0 0 3px rgba(124, 203, 0, 0.25);
    }

    /* Título de sección */
    .section-title {
      color: var(--sena-blue);
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: -0.2px;
    }
    .section-title i {
      color: var(--sena-green);
      font-size: 1.2rem;
    }

    /* Cards */
    .item-card {
      border: none;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 50, 77, 0.06);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.28s ease;
      height: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      border-top: 4px solid var(--sena-green);
    }
    .item-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(57, 169, 0, 0.18);
      border-top-color: var(--sena-yellow);
    }

    .item-card .card-body {
      padding: 1.35rem 1.3rem 1.15rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Header de card */
    .item-header {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      margin-bottom: 1rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px dashed #e6ede2;
    }
    .item-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: #fff;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--sena-green) 0%, var(--sena-green-dark) 100%);
      box-shadow: 0 6px 16px rgba(57, 169, 0, 0.28);
      position: relative;
    }
    .item-icon::after {
      content: "";
      position: absolute;
      bottom: -2px; right: -2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--sena-yellow);
      border: 2px solid #fff;
    }

    .item-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--sena-blue);
      margin: 0 0 0.2rem 0;
      line-height: 1.35;
      word-break: break-word;
    }
    .item-sub {
      font-size: 0.7rem;
      color: #8a92a6;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .item-sub i { color: var(--sena-green); }

    /* Filas campo-valor */
    .field-row {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.5rem 0;
      font-size: 0.87rem;
      border-bottom: 1px solid #f0f4ed;
    }
    .field-row:last-child { border-bottom: none; padding-bottom: 0; }
    .field-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      background: #eaf6e2;
      color: var(--sena-green-dark);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .field-text { flex: 1; min-width: 0; }
    .field-key {
      display: block;
      color: #8a92a6;
      font-weight: 700;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.15rem;
    }
    .field-val {
      color: var(--ink);
      font-weight: 500;
      word-break: break-word;
      line-height: 1.4;
    }
    .field-val a {
      color: var(--sena-green-dark);
      text-decoration: none;
      font-weight: 700;
    }
    .field-val a:hover { text-decoration: underline; }

    /* Chips institucionales */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.22rem 0.65rem;
      font-size: 0.73rem;
      font-weight: 700;
      border-radius: 999px;
      background: #eaf6e2;
      color: var(--sena-green-dark);
    }
    .chip.success {
      background: linear-gradient(135deg, rgba(57,169,0,0.15), rgba(124,203,0,0.2));
      color: var(--sena-green-dark);
    }
    .chip.danger {
      background: #fdecea;
      color: #c0392b;
    }
    .chip.amber {
      background: #fff7e0;
      color: #a06a00;
    }
    .chip.sky {
      background: #e6f1f8;
      color: var(--sena-blue);
    }
    .chip.brand {
      background: linear-gradient(135deg, var(--sena-blue) 0%, #005580 100%);
      color: #fff;
    }

    /* Estados */
    .state-box {
      padding: 3.5rem 1.5rem;
      text-align: center;
      color: var(--ink-soft);
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0, 50, 77, 0.08);
      border: 1px solid #eef2eb;
    }
    .state-box i {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
    .state-box .bi-inbox { color: var(--sena-green); }
    .state-box .bi-exclamation-triangle { color: #c0392b; }

    .spinner-brand {
      width: 3rem;
      height: 3rem;
      border-width: 0.25rem;
      color: var(--sena-green) !important;
    }

    /* Footer */
    .app-footer {
      color: #8a92a6;
      font-size: 0.8rem;
      text-align: center;
      padding: 1.5rem 0;
      font-weight: 500;
    }
    .app-footer strong { color: var(--sena-green-dark); }
    .app-footer i { color: var(--sena-yellow); }

    /* Animación */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .item-card { animation: fadeUp 0.45s ease backwards; }
  </style>
</head>
<body>

  <!-- Franja superior institucional -->
  <div class="top-strip"></div>

  <!-- Header -->
  <header class="app-header py-3 mb-4">
    <div class="container d-flex align-items-center gap-3">
      <div class="logo-badge">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <div>
        <h1 class="h5 app-title mb-0">
          <span class="accent">SENA</span> · Capacitaciones
        </h1>
        <div class="app-sub">
          <i class="bi bi-shield-check" style="color:var(--sena-green);"></i>
          Servicio Nacional de Aprendizaje
        </div>
      </div>
      <button id="btnRecargar" class="btn btn-sena ms-auto">
        <i class="bi bi-arrow-clockwise me-1"></i> Recargar
      </button>
    </div>
  </header>

  <!-- Contenido -->
  <main class="container pb-4" style="position:relative;z-index:1;">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h2 class="section-title">
        <i class="bi bi-grid-1x2-fill"></i> Listado de Registros
      </h2>
      <span id="contador" class="count-pill d-none">0 registros</span>
    </div>

    <div id="contenido">
      <div class="state-box">
        <div class="spinner-border spinner-brand" role="status"></div>
        <p class="mt-3 mb-0 fw-semibold">Cargando capacitaciones…</p>
      </div>
    </div>

    <p class="app-footer">
      <i class="bi bi-heart-fill"></i>
      Plataforma institucional <strong>SENA</strong> · Datos en tiempo real desde Supabase
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_URL = 'https://uachaedjvdssdtlwebfy.supabase.co/rest/v1/capacitaciones?select=*';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhY2hhZWRqdmRzc2R0bHdlYmZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MDYyMjcsImV4cCI6MjEwNzA4MjIyN30.cNxSbcUlblFTV0rh93Ni5AZcY6vzqH-9EZx0BonvV7w';

    const contenido   = document.getElementById('contenido');
    const contador    = document.getElementById('contador');
    const btnRecargar = document.getElementById('btnRecargar');

    const esc = (v) => String(v ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    const titulo = (k) => k
      .replace(/_/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase());

    // Íconos temáticos por nombre de campo
    const ICONOS_CAMPO = {
      id: 'bi-hash',
      nombre: 'bi-person-badge',
      titulo: 'bi-bookmark-star',
      descripcion: 'bi-card-text',
      instructor: 'bi-person-video3',
      docente: 'bi-person-video3',
      fecha: 'bi-calendar-event',
      fecha_inicio: 'bi-calendar-check',
      fecha_fin: 'bi-calendar-x',
      hora: 'bi-clock',
      hora_inicio: 'bi-clock-history',
      hora_fin: 'bi-clock-fill',
      duracion: 'bi-hourglass-split',
      modalidad: 'bi-laptop',
      lugar: 'bi-geo-alt',
      ubicacion: 'bi-geo-alt-fill',
      cupos: 'bi-people',
      participantes: 'bi-people-fill',
      estado: 'bi-flag',
      categoria: 'bi-tag',
      tipo: 'bi-bookmark',
      area: 'bi-diagram-3',
      nivel: 'bi-bar-chart-steps',
      costo: 'bi-cash-coin',
      precio: 'bi-cash-stack',
      horas: 'bi-clock-history',
      creditos: 'bi-award',
      enlace: 'bi-link-45deg',
      url: 'bi-link-45deg',
      imagen: 'bi-image',
      email: 'bi-envelope',
      correo: 'bi-envelope-at',
      telefono: 'bi-telephone',
      ficha: 'bi-card-checklist',
      programa: 'bi-journal-bookmark-fill',
      centro: 'bi-building',
      regional: 'bi-geo',
    };

    const getIcono = (k) => ICONOS_CAMPO[k.toLowerCase()] || 'bi-dot';

    function getIconoPrincipal(texto) {
      const t = String(texto).toLowerCase();
      if (/curso|taller|capacitac/.test(t)) return 'bi-mortarboard-fill';
      if (/seminario|conferencia|charla/.test(t)) return 'bi-mic-fill';
      if (/diplomado|maestr/.test(t)) return 'bi-award-fill';
      if (/certificac/.test(t)) return 'bi-patch-check-fill';
      if (/seguridad|riesgo/.test(t)) return 'bi-shield-fill-check';
      if (/salud|medic/.test(t)) return 'bi-heart-pulse-fill';
      if (/tecno|sistema|software|programac/.test(t)) return 'bi-cpu-fill';
      if (/admin|gestion|contab/.test(t)) return 'bi-briefcase-fill';
      if (/ingles|idioma|language/.test(t)) return 'bi-translate';
      if (/sostenib|ambient/.test(t)) return 'bi-tree-fill';
      return 'bi-bookmark-star-fill';
    }

    function getTitulo(item) {
      const pref = ['nombre', 'titulo', 'name', 'title', 'capacitacion', 'programa', 'descripcion'];
      for (const k of pref) if (item[k]) return item[k];
      const found = Object.entries(item).find(([_, v]) => typeof v === 'string' && v);
      return found ? found[1] : 'Registro';
    }

    function formatearValor(val, key) {
      if (val === null || val === undefined || val === '')
        return '<span class="text-muted">—</span>';

      if (typeof val === 'boolean')
        return val
          ? '<span class="chip success"><i class="bi bi-check-circle-fill"></i> Sí</span>'
          : '<span class="chip danger"><i class="bi bi-x-circle-fill"></i> No</span>';

      if (typeof val === 'object')
        return `<code>${esc(JSON.stringify(val))}</code>`;

      const str = String(val);

      if (/^https?:\/\//i.test(str))
        return `<a href="${esc(str)}" target="_blank" rel="noopener">
                  <i class="bi bi-box-arrow-up-right me-1"></i>${esc(str.length > 40 ? str.slice(0,40)+'…' : str)}
                </a>`;

      if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(str))
        return `<a href="mailto:${esc(str)}"><i class="bi bi-envelope-fill me-1"></i>${esc(str)}</a>`;

      if (/^\d{4}-\d{2}-\d{2}T/.test(str)) {
        const d = new Date(str);
        if (!isNaN(d)) {
          const fecha = d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
          return `<span class="chip sky"><i class="bi bi-calendar-event-fill"></i> ${fecha}</span>`;
        }
      }
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
        const d = new Date(str + 'T00:00:00');
        const fecha = d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
        return `<span class="chip sky"><i class="bi bi-calendar-event-fill"></i> ${fecha}</span>`;
      }

      const lk = key.toLowerCase();
      if (lk === 'estado' || lk === 'status') {
        const s = str.toLowerCase();
        if (/activo|active|abierto|disponible|aprobado|inscrito/.test(s))
          return `<span class="chip success"><i class="bi bi-check-circle-fill"></i> ${esc(str)}</span>`;
        if (/inactivo|cerrado|finalizado|cancelado|rechazado/.test(s))
          return `<span class="chip danger"><i class="bi bi-x-circle-fill"></i> ${esc(str)}</span>`;
        if (/pendiente|proceso|revision|espera/.test(s))
          return `<span class="chip amber"><i class="bi bi-hourglass-split"></i> ${esc(str)}</span>`;
      }

      if (lk === 'modalidad') {
        const s = str.toLowerCase();
        if (/virtual|online/.test(s))
          return `<span class="chip sky"><i class="bi bi-laptop"></i> ${esc(str)}</span>`;
        if (/presencial/.test(s))
          return `<span class="chip"><i class="bi bi-building"></i> ${esc(str)}</span>`;
        if (/hibrid|mixt/.test(s))
          return `<span class="chip amber"><i class="bi bi-arrow-left-right"></i> ${esc(str)}</span>`;
      }

      if (lk === 'ficha' || lk === 'programa' || lk === 'categoria') {
        return `<span class="chip brand">${esc(str)}</span>`;
      }

      return esc(str);
    }

    function buildCuerpo(item, excluido) {
      const entradas = Object.entries(item).filter(([k]) => k !== excluido);
      if (!entradas.length) return '<p class="text-muted small mb-0">Sin más campos.</p>';

      return entradas.map(([k, v]) => `
        <div class="field-row">
          <div class="field-icon"><i class="bi ${getIcono(k)}"></i></div>
          <div class="field-text">
            <span class="field-key">${esc(titulo(k))}</span>
            <span class="field-val">${formatearValor(v, k)}</span>
          </div>
        </div>
      `).join('');
    }

    function renderCards(datos) {
      if (!Array.isArray(datos) || datos.length === 0) {
        contenido.innerHTML = `
          <div class="state-box">
            <i class="bi bi-inbox"></i>
            <p class="mb-0 fw-semibold">No hay capacitaciones registradas.</p>
          </div>`;
        contador.classList.add('d-none');
        return;
      }

      const pref = ['nombre', 'titulo', 'name', 'title', 'capacitacion', 'programa', 'descripcion'];
      let campoTitulo = pref.find(p => datos[0].hasOwnProperty(p));
      if (!campoTitulo) {
        const f = Object.entries(datos[0]).find(([_, v]) => typeof v === 'string' && v);
        campoTitulo = f ? f[0] : null;
      }

      const cards = datos.map((item, i) => {
        const tituloTexto = campoTitulo ? item[campoTitulo] : getTitulo(item);
        const cuerpo = buildCuerpo(item, campoTitulo);
        const id = item.id ?? '';
        const iconoPrincipal = getIconoPrincipal(tituloTexto ?? '');

        return `
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="item-card" style="animation-delay:${i * 60}ms;">
              <div class="card-body">
                <div class="item-header">
                  <div class="item-icon"><i class="bi ${iconoPrincipal}"></i></div>
                  <div class="flex-grow-1" style="min-width:0;">
                    <p class="item-title">${esc(tituloTexto ?? 'Sin título')}</p>
                    ${id ? `<span class="item-sub"><i class="bi bi-hash"></i>${esc(String(id).slice(0, 8))}</span>` : ''}
                  </div>
                </div>
                ${cuerpo}
              </div>
            </div>
          </div>
        `;
      }).join('');

      contenido.innerHTML = `<div class="row g-3 g-md-4">${cards}</div>`;
      contador.textContent = `${datos.length} registro${datos.length !== 1 ? 's' : ''}`;
      contador.classList.remove('d-none');
    }

    function renderError(msg) {
      contenido.innerHTML = `
        <div class="state-box">
          <i class="bi bi-exclamation-triangle"></i>
          <p class="mb-1 fw-bold" style="color:#c0392b">No se pudieron cargar los datos</p>
          <small class="text-muted">${esc(msg)}</small>
        </div>`;
      contador.classList.add('d-none');
    }

    async function obtenerCapacitaciones() {
      contenido.innerHTML = `
        <div class="state-box">
          <div class="spinner-border spinner-brand" role="status"></div>
          <p class="mt-3 mb-0 fw-semibold">Cargando capacitaciones…</p>
        </div>`;
      contador.classList.add('d-none');
      btnRecargar.disabled = true;

      try {
        const respuesta = await fetch(API_URL, {
          method: 'GET',
          headers: {
            'apikey': API_KEY,
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json'
          }
        });

        if (!respuesta.ok) throw new Error(`Error HTTP ${respuesta.status} - ${respuesta.statusText}`);

        const datos = await respuesta.json();
        console.log('Datos recibidos:', datos);
        renderCards(datos);

      } catch (error) {
        console.error(error);
        renderError(error.message);
      } finally {
        btnRecargar.disabled = false;
      }
    }

    btnRecargar.addEventListener('click', obtenerCapacitaciones);
    obtenerCapacitaciones();
  </script>
</body>
</html>
